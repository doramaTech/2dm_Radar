    { id: 165, nome: "Proposta de Colaborações ICs (Anúncio ou Chamada)", prio: "p4", tipo: "Doc", esforco: "alto", onda: 5, obs: "Proposta de colaboração acadêmica para Iniciação Científica." },
    { id: 166, nome: "Aplicação para FAPESP do PLANAR - Submeter", prio: "p4", tipo: "Submissão", esforco: "alto", onda: 5, obs: "Documento de submissão de projeto PLANAR para financiamento FAPESP." },
    { id: 167, nome: "Junta Documentos PLANAR", prio: "p4", tipo: "Doc", esforco: "alto", onda: 5, obs: "Consolidação de documentos e registros técnicos do projeto PLANAR." },
    { id: 168, nome: "Página para Provedores e Consultoria sobre UTM do PLANAR", prio: "p3", tipo: "Doc", esforco: "medio", onda: 4, obs: "Documento de referência e orientação para provedores e consultoria UTM." },
    { id: 169, nome: "Planejamento de Fórum sobre Publicações Curtas UTM - UAS, BVLOS", prio: "p4", tipo: "Doc", esforco: "alto", onda: 5, obs: "Planejamento estratégico de fórum de publicação curta." }
];

    // ============================================================
    // RENDERIZAÇÃO
    // ============================================================
    const tbody = document.getElementById('tbodyItens');
    const searchInput = document.getElementById('searchInput');
    const contadorVisivel = document.getElementById('contadorVisivel');
    const totalItens = document.getElementById('totalItens');

    let prioAtivas = new Set(['p1', 'p2', 'p3', 'p4', 'p5']);
    let ondasAtivas = new Set([1, 2, 3, 4, 5]);
    let termoBusca = '';

    totalItens.textContent = itens.length;

    function prioLabel(p) {
        const map = { p1: 'P1 · Imediata', p2: 'P2 · Curto', p3: 'P3 · Médio', p4: 'P4 · Longo', p5: 'P5 · Backlog' };
        return map[p] || p;
    }

    function prioClass(p) {
        return 'prio prio-' + p;
    }

    function ondaClass(n) {
        return 'onda-badge onda-' + (n <= 5 ? n : 5);
    }

    function esforcoClass(e) {
        if (e === 'baixo') return 'esforco esforco-baixo';
        if (e === 'medio') return 'esforco esforco-medio';
        return 'esforco esforco-alto';
    }

    function esforcoLabel(e) {
        return e === 'baixo' ? 'Baixo' : e === 'medio' ? 'Médio' : 'Alto';
    }

    function render() {
        const filtrados = itens.filter(item => {
            if (!prioAtivas.has(item.prio)) return false;
            if (!ondasAtivas.has(item.onda)) return false;
            if (termoBusca.trim() !== '') {
                const t = termoBusca.toLowerCase();
                const hay = (item.nome + ' ' + item.obs + ' ' + item.tipo + ' ' + (item.id + '')).toLowerCase();
                if (!hay.includes(t)) return false;
            }
            return true;
        });

        if (filtrados.length === 0) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="7">Nenhum item encontrado com os filtros atuais. Ajuste a pesquisa ou limpe os filtros.</td></tr>`;
            contadorVisivel.textContent = '0';
            return;
        }

        // ordenar por id
        filtrados.sort((a, b) => a.id - b.id);

        let html = '';
        for (const item of filtrados) {
            html += `<tr>
                <td class="id-cell">${item.id}</td>
                <td class="item-name">${escapeHtml(item.nome)}</td>
                <td><span class="${prioClass(item.prio)}">${prioLabel(item.prio)}</span></td>
                <td><span class="tipo-badge">${escapeHtml(item.tipo)}</span></td>
                <td><span class="${esforcoClass(item.esforco)}">${esforcoLabel(item.esforco)}</span></td>
                <td><span class="${ondaClass(item.onda)}">🌊 ${item.onda}</span></td>
                <td class="obs">${escapeHtml(item.obs)}</td>
            </tr>`;
        }
        tbody.innerHTML = html;
        contadorVisivel.textContent = filtrados.length;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            if (m === "'") return '&#39;';
            return m;
        });
    }

    // ============================================================
    // EVENTOS
    // ============================================================
    searchInput.addEventListener('input', function() {
        termoBusca = this.value;
        render();
    });

    document.querySelectorAll('.filter-btn[data-prio]').forEach(btn => {
        btn.addEventListener('click', function() {
            const p = this.dataset.prio;
            if (prioAtivas.has(p)) {
                prioAtivas.delete(p);
                this.classList.remove('active');
            } else {
                prioAtivas.add(p);
                this.classList.add('active');
            }
            render();
        });
    });

    document.querySelectorAll('.filter-btn[data-onda]').forEach(btn => {
        btn.addEventListener('click', function() {
            const o = parseInt(this.dataset.onda, 10);
            if (ondasAtivas.has(o)) {
                ondasAtivas.delete(o);
                this.classList.remove('active');
            } else {
                ondasAtivas.add(o);
                this.classList.add('active');
            }
            render();
        });
    });

    document.getElementById('resetFilters').addEventListener('click', function() {
        prioAtivas = new Set(['p1', 'p2', 'p3', 'p4', 'p5']);
        ondasAtivas = new Set([1, 2, 3, 4, 5]);
        termoBusca = '';
        searchInput.value = '';

        document.querySelectorAll('.filter-btn[data-prio]').forEach(b => b.classList.add('active'));
        document.querySelectorAll('.filter-btn[data-onda]').forEach(b => b.classList.add('active'));

        render();
    });

    // inicial
    render();
</script>
</body>
</html>
